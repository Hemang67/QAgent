name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # The full fixture suite takes about 15 minutes on a laptop; leave room for slower runners
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      # Toolchains of the Flask and ASP.NET fixture apps
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Runs QAgent against the fixture apps with the runner's Chrome
      - run: npm run test:e2e
